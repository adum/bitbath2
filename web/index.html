<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitbath Viewer</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --border: #d8d6cf;
    --accent: #2f6fde;
    --highlight: #fff3c4;
    --p1: #d64541;
    --p2: #2f6fde;
    --neutral: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --panel: #1d2024;
      --text: #e6e6e6;
      --muted: #9aa1a9;
      --border: #33373d;
      --accent: #6aa0ff;
      --highlight: #3a3420;
      --p1: #ef6a64;
      --p2: #5b93ff;
      --neutral: #8b8f94;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header, footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  footer { border-top: 1px solid var(--border); border-bottom: none; }
  header h1 { font-size: 16px; margin: 0; }
  #matchup { color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  #board { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #side {
    width: 340px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 16px;
  }
  #side h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  #side h2:first-child { margin-top: 0; }
  .players { width: 100%; border-collapse: collapse; }
  .players td, .players th { padding: 2px 4px; }
  .players th { font-weight: normal; font-size: 12px; color: var(--muted); text-align: right; }
  .players td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .players td:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  #orders { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  #orders div { padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  #orders div:hover { background: var(--bg); }
  #orders div.current { background: var(--highlight); }
  #orders div.err { color: var(--p1); }
  #reply { margin-top: 6px; min-height: 1.4em; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 200px; overflow-y: auto; }
  details summary { cursor: pointer; color: var(--muted); }
  #hover { color: var(--muted); min-height: 3em; }
  button, select, input[type=file]::file-selector-button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #slider { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #position { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 9em; }
  #empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--muted); text-align: center; padding: 16px;
  }
  #board.dragging { outline: 3px dashed var(--accent); outline-offset: -8px; }
  #error { color: var(--p1); white-space: pre-wrap; }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #board { min-height: 60vh; }
    #side { width: auto; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Bitbath</h1>
  <input type="file" id="file" accept=".bbr,.jsonl,.json">
  <span id="matchup"></span>
</header>
<main>
  <div id="board">
    <canvas id="canvas"></canvas>
    <div id="empty">
      <div>Open a replay (<span class="mono">.bbr</span>) or drop one here.</div>
      <div>Replays are written to <span class="mono">runs/</span> by <span class="mono">bitbath play</span>.</div>
      <div id="error"></div>
    </div>
  </div>
  <aside id="side">
    <h2 id="turn-title">No replay</h2>
    <table class="players" id="players"></table>
    <h2>Turn</h2>
    <div id="turn-info" class="mono"></div>
    <div id="orders" class="mono"></div>
    <div id="reply" class="mono"></div>
    <h2>Hover</h2>
    <div id="hover" class="mono"></div>
    <div id="notes"></div>
  </aside>
</main>
<footer>
  <button id="first" title="Start (Home)">⏮</button>
  <button id="prev-turn" title="Previous turn (↑ or Shift+←)">⏪</button>
  <button id="prev" title="Previous order (←)">◀</button>
  <button id="play" title="Play or pause (Space)">▶</button>
  <button id="next" title="Next order (→)">▶|</button>
  <button id="next-turn" title="Next turn (↓ or Shift+→)">⏩</button>
  <button id="last" title="End (End)">⏭</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span id="position"></span>
  <select id="speed" title="Playback speed">
    <option value="turn:1000">1 turn/s</option>
    <option value="turn:333" selected>3 turns/s</option>
    <option value="turn:100">10 turns/s</option>
    <option value="order:200">5 orders/s</option>
    <option value="order:50">20 orders/s</option>
  </select>
  <select id="view" title="Fog of war">
    <option value="0">Both players</option>
    <option value="1">Player 1's view</option>
    <option value="2">Player 2's view</option>
  </select>
  <label><input type="checkbox" id="debug" checked> Debug</label>
</footer>
<script src="bitbath_wasm.js"></script>
<script src="viewer.js"></script>
</body>
</html>
